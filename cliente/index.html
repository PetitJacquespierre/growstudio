<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Clientes - Grow Studio</title>
    
    <link rel="icon" href="../img/growisotipo.png?v=2" type="image/png">
    <link rel="shortcut icon" href="../img/growisotipo.png?v=2" type="image/png">
    
    <!-- Fuentes y Estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Background Orbs -->
    <div class="orbs-background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        
        <!-- PANTALLA DE LOGIN -->
        <div id="login-screen" class="glass-card active">
            <div class="logo-container">
                <a href="../index.html">
                    <img src="../img/growisotipo.png" alt="Grow Studio" class="logo-img">
                </a>
                <h2>Grow Studio</h2>
                <p>Portal de Clientes SaaS</p>
            </div>

            <div class="form-group">
                <label for="cedula-input"><i class="fa-solid fa-id-card"></i> Ingresa tu Cédula, RIF o Usuario</label>
                <input type="text" id="cedula-input" placeholder="Ej. 14074299 o difoodpoint" autocomplete="off">
            </div>

            <button id="btn-login" class="btn-primary" onclick="login()">
                <i class="fa-solid fa-right-to-bracket"></i> Ingresar al Portal
            </button>
            <p id="login-error" class="error-msg"></p>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="../index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.3s;"><i class="fa-solid fa-arrow-left"></i> Volver a Grow Studio</a>
            </div>
        </div>


        <!-- PANTALLA DEL DASHBOARD (Oculta hasta loguearse) -->
        <div id="dashboard-screen" class="glass-card hidden">
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Salir</button>
            
            <div class="header-info">
                <h3>Bienvenido, <span id="dash-cliente-nombre">---</span></h3>
                <p class="proyecto-badge"><i class="fa-solid fa-rocket"></i> Proyecto: <strong id="dash-proyecto">---</strong></p>
            </div>

            <div class="status-grid">
                <!-- Tarjeta Deuda -->
                <div class="status-card">
                    <p class="status-label">Deuda Actual</p>
                    <h2 class="deuda-monto">$<span id="dash-deuda">0.00</span> <span style="font-size: 1rem; color: #a1a1aa;">USD</span></h2>
                    <p style="margin: 6px 0 0 0; font-size: 0.95rem; color: #a1a1aa;">
                        ≈ <strong id="dash-deuda-bs" style="color: #4ade80;">0.00</strong> Bs
                        <span style="font-size: 0.75rem; color: #71717a; display: block; margin-top: 2px;">Tasa Oficial BCV: <span id="dash-bcv-rate">0.00</span> Bs/$</span>
                    </p>
                </div>

                <!-- Tarjeta Estado -->
                <div class="status-card">
                    <p class="status-label">Estado del Servicio</p>
                    <div id="dash-estado-badge" class="badge badge-active">ACTIVO</div>
                </div>
            </div>

            <hr class="divider">

            <div class="report-section">
                <h4><i class="fa-solid fa-file-invoice-dollar"></i> Reportar Pago</h4>
                <p class="report-desc">Registra aquí tu pago para que sea validado y descontado de tu deuda.</p>

                <div class="form-row">
                    <div class="form-group w-50">
                        <label id="label-pay-monto">Monto a Pagar (Bs)</label>
                        <input type="number" id="pay-monto" placeholder="0.00" step="0.01">
                        <small id="pay-monto-hint" style="color: #a1a1aa; font-size: 0.75rem; margin-top: 4px; display: block;"></small>
                    </div>
                    <div class="form-group w-50">
                        <label>Método de Pago</label>
                        <select id="pay-metodo">
                            <option value="Pago Móvil">Pago Móvil</option>
                            <option value="Divisa">Divisa</option>
                            <option value="Zelle">Zelle</option>
                            <option value="Binance">Binance (USDT)</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Número de Referencia</label>
                    <input type="text" id="pay-ref" placeholder="Últimos 4 o 6 dígitos de la transferencia">
                </div>

                <button id="btn-reportar" class="btn-success" onclick="reportarPago()">
                    <i class="fa-solid fa-paper-plane"></i> Enviar Reporte
                </button>
                <p id="report-msg" class="msg-box"></p>
            </div>

        </div>

    </div>

    <!-- Script de Lógica -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
